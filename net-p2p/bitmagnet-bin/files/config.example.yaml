# Example configuration for bitmagnet
# Place in /etc/bitmagnet/config.yml and specify EXTRA_CONFIG_FILES=/etc/bitmagnet/config.yml
# or place in /var/lib/bitmagnet/config.yml (working directory)

postgres:
  host: localhost
  port: 5432
  name: bitmagnet
  user: postgres
  password: ""

