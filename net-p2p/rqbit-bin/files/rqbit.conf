# /etc/rqbit/rqbit.conf
# Configuration for rqbit daemon (environment file)

# HTTP API and Web UI listen address (e.g. 127.0.0.1:3030 or 0.0.0.0:3030)
#RQBIT_HTTP_API_LISTEN_ADDR="127.0.0.1:3030"

# Allow creating torrents via HTTP API
#RQBIT_HTTP_API_ALLOW_CREATE=true

# Upload body size limit in bytes
#RQBIT_HTTP_API_MAX_UPLOAD_SIZE=

# Advertise HTTP API on local network via mDNS (requires non-loopback listen address)
#RQBIT_MDNS_ENABLE=true

# BitTorrent peer listening port (default: 4240)
#RQBIT_LISTEN_PORT=4240

# BitTorrent peer listening IP (default: ::)
#RQBIT_LISTEN_IP="::"

# Logging configuration
#RQBIT_LOG_LEVEL_CONSOLE="info"
#RQBIT_LOG_FILE="/var/log/rqbit/rqbit.log"
#RQBIT_LOG_FILE_RUST_LOG=""

# Session persistence
#RQBIT_SESSION_PERSISTENCE_LOCATION="/var/lib/rqbit/session"
#RQBIT_SESSION_PERSISTENCE_DISABLE=false
#RQBIT_FASTRESUME=true

# Folder to watch for added .torrent files
#RQBIT_WATCH_FOLDER="/var/lib/rqbit/watch"

# Download and upload rate limits (bytes per second)
#RQBIT_RATELIMIT_DOWNLOAD=
#RQBIT_RATELIMIT_UPLOAD=

# DHT configuration
#RQBIT_DHT_DISABLE=false
#RQBIT_DHT_PERSISTENCE_DISABLE=false
#RQBIT_DHT_BOOTSTRAP=""

# UPnP port forwarding
#RQBIT_UPNP_PORT_FORWARD_DISABLE=false

# Socks5 proxy (e.g. socks5://127.0.0.1:9050)
#RQBIT_SOCKS_PROXY_URL=""

# Peer connection timeouts
#RQBIT_PEER_CONNECT_TIMEOUT="2s"
#RQBIT_PEER_READ_WRITE_TIMEOUT="10s"

# Maximum connected peers per torrent
#RQBIT_PEER_LIMIT=

# Worker threads (default: CPU cores)
#RQBIT_RUNTIME_WORKER_THREADS=

# Process umask
#RQBIT_UMASK=022
